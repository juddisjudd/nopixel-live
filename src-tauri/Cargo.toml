[package]
name = "nopixel-live"
version = "0.1.0"
description = "Live NoPixel streamers across Twitch and Kick, played through Streamlink"
edition = "2024"
rust-version = "1.90"

[lib]
name = "nopixel_live_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2.7.2"
tokio = { version = "1.53.3", features = ["time", "sync", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "gzip", "http2", "charset"] }
futures = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
