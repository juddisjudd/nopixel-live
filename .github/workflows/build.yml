name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Check and build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Read the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3, got $TAG"
            exit 1
          fi
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":true}}\n' "$version" > "$RUNNER_TEMP/version.json"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

      - name: Build the installer
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -f "$RUNNER_TEMP/version.json" ]; then
            if [ -z "$SIGNING_KEY" ]; then
              echo "::error::Add the updater private key as the TAURI_SIGNING_PRIVATE_KEY repository secret."
              exit 1
            fi
            # A pasted secret often ends in a newline, which breaks the base64 key.
            TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
            export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
            pnpm tauri build --config "$RUNNER_TEMP/version.json"
          else
            pnpm tauri build
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NoPixel-Live-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NoPixel-Live-Windows
          path: installer

      - name: Write the update manifest
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: installer
        run: |
          for file in *; do
            [ "$file" = "${file// /.}" ] || mv -- "$file" "${file// /.}"
          done
          exe=$(ls -- *-setup.exe)
          jq -n \
            --arg version "${TAG#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat -- "$exe.sig")" \
            --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$exe" \
            '{version: $version, pub_date: $date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > latest.json

      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "NoPixel Live ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" installer/*.exe installer/*.exe.sig installer/latest.json --clobber
